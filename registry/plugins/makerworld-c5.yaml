name: 3MF Converter
summary: Rebuilds a MakerWorld link or local 3MF for the printer currently selected in OrcaSlicer.
description: >-
  The converter replaces the original machine settings with those of the selected printer.
  It retains the designer's process settings, such as layer height, walls, infill, and supports.
  Drop a local 3MF into its tab or choose one with the file dialog.
  For a MakerWorld link, sign in with a Bambu Cloud token and select the plate to convert.
  The plugin retains the saved token when you install an update.
repository: https://github.com/ben0551/orca-3mf-converter
categories:
  - profiles-and-calibration
status: available
status_note: The author publishes a standalone Python plugin and documents local-file and MakerWorld conversion.
installation:
  method: python
  url: https://github.com/ben0551/orca-3mf-converter#install
  notes: Install 3mf-converter_any.py through Plugins. The Creator 5 printer agent is not required.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or newer.
  platforms: []
  requires_custom_build: false
  notes: Requires a selected printer profile. Local 3MF conversion does not need a Bambu Cloud token.
