name: Smoothing Wall Speed Along Z
summary: Smooths outer-wall speed changes between neighboring layers to reduce vertical print banding.
description: >-
  Relaxes outer-wall speed changes between adjacent layers using Gaussian
  smoothing or configurable gradient limits. It slows faster sections rather
  than speeding up slow overhangs. The plugin provides a tab for simple and
  advanced configuration and synchronizes settings across slicing sessions.
  The README documents OrcaCloud and local installation and lists Windows,
  Linux, and macOS as supported platforms.
repository: https://github.com/persano/smooth-z-wall-speed-plugin
