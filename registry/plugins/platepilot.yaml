name: PlatePilot
summary: Organizes downloaded model files into a searchable library and multi-plate OrcaSlicer projects.
description: >-
  PlatePilot indexes model files from watched folders, archives, and files added through its interface.
  It previews STL, 3MF, and STEP parts and can arrange selected parts across multiple plates.
  Users can collect parts from several sources in a basket before arranging them together.
  The plugin opens the generated project in OrcaSlicer, with direct project opening documented for Windows only.
  Smart layout groups parts near the center of the bed and balances them across plates.
repository: https://github.com/GNUGiminot/platepilot-orcaslicer
categories:
  - modeling-and-textures
status: experimental
status_note: Upstream publishes an installable wheel and no longer labels Smart layout beta; feature support still varies by platform.
installation:
  method: wheel
  url: https://github.com/GNUGiminot/platepilot-orcaslicer/releases/latest
  notes: Install the PlatePilot wheel through Plugins or subscribe through Orca Cloud.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or newer with plugins enabled.
  platforms:
    - windows
    - macos
    - linux
  requires_custom_build: false
  notes: macOS and Linux users must enter watched-folder paths and open generated projects manually. Upstream has not tested Orca auto-arrange there.
