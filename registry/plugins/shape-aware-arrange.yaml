name: Organizer (Shape-Aware Arrange)
summary: Arranges parts by their projected outlines and fills remaining plate space with copies.
description: >-
  Organizer arranges objects using their top-down outlines so concave shapes can interlock.
  Its Fill operation adds copies of plate objects until no more fit.
  The plugin saves the arrangement as a new project and opens it in OrcaSlicer.
  Its footprint calculation does not account for brims, supports, skirts, or travel moves.
  Users should inspect the sliced result before printing.
repository: https://github.com/bloodf/orca_organizer
categories:
  - modeling-and-textures
status: available
status_note: The README documents Orca Cloud installation and functioning arrange and fill controls.
installation:
  method: python
  url: https://github.com/bloodf/orca_organizer#install
  notes: Subscribe through Orca Cloud or install the plugin using the repository instructions.
compatibility:
