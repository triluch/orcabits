name: Support Fins
summary: Adds breakaway fins to sliced layer polygons through OrcaSlicer's slicing-pipeline API.
description: >-
  Runs the printfins.com geometry engine on the model being sliced and merges
  generated fin cross-sections into OrcaSlicer's layer polygons. Fins follow
  model transforms when resliced, and the plugin can skip objects that already
  have OrcaSlicer supports enabled. The settings page exposes the fin controls
  in OrcaSlicer. The plugin must be enabled in the process preset, and automatic
  brim behavior can differ from a model with fins already included.
repository: https://github.com/gittrahan/support-fins
categories:
  - toolpaths-and-gcode
status: available
status_note: Upstream publishes the plugin to Orca Cloud and reports real Windows nightly slicing tests.
installation:
  method: python
  url: https://github.com/gittrahan/support-fins/blob/HEAD/plugins/orca/README.md
  notes: Subscribe through Orca Cloud or install the single-file Python build. Then select Support Fins in the process slicing-pipeline settings.
compatibility:
  orca_slicer: OrcaSlicer 2.5 with Python plugins and the slicing-pipeline API.
  platforms:
    - windows
  requires_custom_build: false
  notes: A real OrcaSlicer 2.5 development nightly was tested on Windows; Orca's bundled uv installs declared Python dependencies.
