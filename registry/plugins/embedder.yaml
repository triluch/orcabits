name: Embedder
summary: Cuts magnet and NFC pockets into models and adds print pauses for embedded inserts.
description: >-
  Pick an insert size and click a face in the Embedder tab to place a pocket with adjustable clearance.
  Open pockets let you press in the insert after printing, while enclosed pockets add a layer pause before the pocket closes.
  The plugin groups pockets that can share a pause and lists the inserts to have ready.
  An automatic mode places symmetric magnet pockets on the bottom and can estimate how many magnets the part needs.
  Applying the changes opens a new project copy and leaves the original untouched.
repository: https://github.com/bloodf/embedder
categories:
  - modeling-and-textures
  - toolpaths-and-gcode
status: available
status_note: A downloadable wheel and an Orca Cloud listing are available, with an author-documented workflow.
installation:
  method: wheel
  url: https://github.com/bloodf/embedder/releases/latest
  notes: Install embedder_any.whl locally and allow background threads, or subscribe through Orca Cloud.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or newer.
  platforms: []
  requires_custom_build: false
  notes: Embedded pockets need pause G-code in the printer profile; open pockets do not.
