name: Open Bamboo Networking
summary: Installs networking support for Bambu Lab cloud printing, remote camera, and AMS synchronization.
description: >-
  This OrcaSlicer plugin installs replacement native networking libraries and
  provides a management tab to set up or restore them. The libraries enable
  cloud printing, remote camera streaming, and AMS slot synchronization on
  supported Bambu Lab printers. It is an unofficial installer for open-source
  native libraries and includes a recovered Bambu application client secret.
  The bundled library also exposes read-only printer snapshots and events for
  third-party queue integrations; the plugin itself does not add a queue UI.
repository: https://github.com/persano/open-bambu-networking-plugin
categories:
  - printer-connectivity
status: available
status_note: The README documents the installer workflow and a published release; supported OrcaSlicer builds are listed explicitly.
installation:
  method: python
  url: https://github.com/persano/open-bambu-networking-plugin#installation
  notes: Use the documented Orca Cloud listing on plugin-enabled builds, or follow the manual ZIP installation instructions.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or newer for the plugin UI; 2.3.0 or newer for manual library installation.
  platforms:
    - windows
    - linux
    - macos
  requires_custom_build: false
  notes: The README lists these platforms but does not claim every printer model is tested.
