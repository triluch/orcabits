name: FHSL — Textiles & Materials
summary: Adds 48 grayscale height-map textures to OrcaSlicer's texture-library selector.
description: >-
  This standalone FilamentHub Surface Library pack installs 48 seamless grayscale height maps.
  The maps are selected through OrcaSlicer's texture-library interface.
  The repository documents a source build that produces a wheel for this pack.
  The current package is a candidate that has not yet been accepted in the target OrcaSlicer build.
repository: https://github.com/WeLizard/orca-plugins
categories:
  - modeling-and-textures
status: experimental
status_note: The source package has a documented wheel build, but its README says the candidate has not been accepted in the target host build.
installation:
  method: source
  url: https://github.com/WeLizard/orca-plugins/blob/main/plugins/fhsl-textiles-materials/PUBLISHING.md
  notes: Build the pack with Python 3.12+ and Pillow using the documented repository command; no wheel is checked into the repository.
compatibility:
  orca_slicer: A build that supports texture-library plugins; the candidate's acceptance is unverified.
  platforms: []
  requires_custom_build: false
  notes: The required host capability and candidate acceptance are not tied to a specific OrcaSlicer version.
evidence:
