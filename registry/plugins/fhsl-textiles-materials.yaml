    url: https://github.com/WeLizard/orca-plugins/blob/main/plugins/fhsl-textiles-materials/README.md
  - label: Build and publishing instructions
    url: https://github.com/WeLizard/orca-plugins/blob/main/plugins/fhsl-textiles-materials/PUBLISHING.md
