name: Filament Match
summary: Matches loaded printer filament to compatible OrcaSlicer presets for review before applying.
description: >-
  Filament Match reads the loaded filament from the connected Moonraker or Snapmaker printer.
  It explains why each installed preset matches and lets you correct the detected filament or choose a different preset.
  It changes the project only when you press Apply, and remembers confirmed mappings for future use.
  Spoolman and the Open Filament Database can enrich the suggestions but are optional.
repository: https://github.com/Brotholomew/filament-match
categories:
  - filament-and-spool-management
  - profiles-and-calibration
status: available
status_note: The author documents Plugin Hub installation and a local source install, and reports testing on OrcaSlicer 2.5.2.
installation:
  method: source
  url: https://github.com/Brotholomew/filament-match#how-to-install
  notes: Subscribe to Filament Match in the Plugin Hub or follow the platform-specific source instructions, then run it from Plugins.
compatibility:
  orca_slicer: A current Python-plugin-enabled build; the author tested 2.5.2.
  platforms:
    - windows
    - macos
    - linux
  requires_custom_build: false
  notes: The author lists all three platforms. Hosts without dock panels open a separate window.
