name: Line Art Studio
summary: Converts a photo into a continuous, constant-width line printed over a generated base.
description: >-
  Converts a photo into one continuous, non-self-crossing line, varying the
  spacing to represent image darkness. During slicing it replaces designated
  upper layers of its generated base with the artwork. The README shows a
  physical print on a Bambu Lab X1 Carbon. On non-Bambu printers the preview
  shows the plain base and users must inspect the exported G-code; automatic
  base insertion is available only on Windows.
repository: https://github.com/barismert98/orcaslicer-line-art-studio
categories:
  - toolpaths-and-gcode
status: available
status_note: README documents the complete workflow and shows a physical print; other-host preview and insertion limits are stated.
installation:
  method: wheel
  url: https://github.com/barismert98/orcaslicer-line-art-studio/releases/latest
  notes: Install the Line Art Studio wheel or subscribe through Orca Cloud, then enable its slicing-pipeline step in the process preset.
compatibility:
  orca_slicer: OrcaSlicer with Pages and Slicing Pipeline plugin APIs.
  platforms: []
  requires_custom_build: false
  notes: Automatic base insertion is Windows-only; operating-system support for the plugin itself is not specified.
evidence:
