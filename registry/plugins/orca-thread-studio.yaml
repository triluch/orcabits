name: Orca Thread Studio
summary: Generates threaded containers, caps, adapters, and matched hardware inside OrcaSlicer.
description: >-
  The studio offers parametric threads with adjustable profiles, pitch, handedness, and clearance.
  It can build containers with matched lids, bottle necks and caps, hose adapters, and nuts and bolts.
  A 3D preview and engagement view show how the parts fit, and calibration rings let you check clearances on your printer.
  Models export as STL or multipart 3MF, and the author marks the bottle-cap presets as experimental.
repository: https://github.com/victorFernande/orca-thread-generator
categories:
  - modeling-and-textures
status: experimental
status_note: Packages and automated checks are available, but the author has not yet verified native activation and plate handoff.
installation:
  method: python
  url: https://github.com/victorFernande/orca-thread-generator/releases/latest
  notes: Install the released orca_thread_generator.py through Plugins and activate it; a wheel is also available.
compatibility:
  orca_slicer: OrcaSlicer 2.5.1 or newer.
  platforms: []
  requires_custom_build: false
  notes: Requires Python 3.12 or newer and NumPy 1.26 or newer. CI covers Windows, macOS, and Linux, but live OrcaSlicer verification is pending on all three.
