name: ChromaSave–SmartPurge
summary: Reorders purge and filament-cutting operations to reduce multi-color filament waste.
description: >-
  Moves filament cutting into permitted internal regions so residual material
  can be consumed before the final purge. It models melt-zone volume and flush
  requirements, with tower/chute and bucket modes. The OrcaSlicer plugin now
  has a visual configuration panel for purge and hotend settings.
  The author reports physical validation on Klipper with SmartPurge.
  Bambu AMS support remains beta, and dynamic pre-cut retraction on Bambu is experimental.
  The Creality SPARKX i7 workflow uses native G-code instead of a custom Klipper macro and is also in beta.
repository: https://github.com/deathstroke-co/ChromaSave
categories:
  - toolpaths-and-gcode
status: experimental
status_note: The author reports physical verification on Klipper and labels the Creality SPARKX i7 and Bambu integrations beta.
