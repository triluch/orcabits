name: Dot Art
summary: Converts an image into variable-size filament domes arranged as a printed halftone.
description: >-
  Turns an uploaded image into a grid of variable-size dots whose dimensions
  represent image tone. Each dot is extruded with the nozzle stationary as a
  dome in a contrasting filament on a base. The documented first test print
  used a Bambu Lab X1 Carbon and showed visible strings between dots. The plugin
  replaces the base's upper layer, and the README notes that the ordinary
  OrcaSlicer time and material estimates are inaccurate for the result.
repository: https://github.com/barismert98/orcaslicer-dot-art
categories:
  - toolpaths-and-gcode
status: experimental
status_note: The README shows an initial test print and identifies later listed features as not yet printed.
installation:
  method: native
  url: https://github.com/barismert98/orcaslicer-dot-art#installation
  notes: Available through OrcaCloud; follow the README's plugin setup and slicing workflow.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or later.
  platforms: []
  requires_custom_build: false
  notes: The example print used a Bambu Lab X1 Carbon; host operating-system support is not specified.
evidence:
