name: Kobra Control
summary: Adds LAN printing and a control dashboard for the Anycubic Kobra X.
description: >-
  The plugin registers a printer agent for OrcaSlicer's Print and Send dialogs
  and adds a Kobra Control tab with status, camera, files, and ACE slot data.
  It also documents Spoolman integration and controls for the local printer.
  Installation is available from Orca Cloud or as a wheel from GitHub releases.
  The author has tested its service layer on a real Kobra X but has not tested
  the plugin inside OrcaSlicer itself.
repository: https://github.com/bloodf/kobracontrol
categories:
  - printer-connectivity
status: experimental
status_note: The author reports service-layer hardware tests but explicitly says the plugin is not yet tested inside OrcaSlicer.
installation:
  method: wheel
  url: https://github.com/bloodf/kobracontrol#-install
  notes: Install kobracontrol_any.whl locally or subscribe to the Orca Cloud listing.
compatibility:
  orca_slicer: Stock OrcaSlicer 2.5.0 or newer.
  platforms: []
  requires_custom_build: false
  notes: A tested operating-system matrix is not stated.
