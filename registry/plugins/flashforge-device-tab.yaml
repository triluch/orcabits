name: FlashForge Device Tab
summary: Adds monitoring, file browsing, history, and job controls for FlashForge printers.
description: >-
  The monitor can open in Device or in a separate FlashForge tab. It shows job
  progress, temperatures, a 30-minute chart, and an optional camera stream. It can browse
  printer files and previews and keeps print history across OrcaSlicer restarts.
  Pause, resume, and cancel controls are available, but the plugin does not
  upload files or start prints. It can open the printer's web interface in your
  browser without closing the monitor.
repository: https://github.com/UshMask/flashforge-device-tab
categories:
  - printer-connectivity
status: available
status_note: The README documents a downloadable release and use with supported FlashForge printers; Creator support is simulator-tested only.
installation:
  method: python
  url: https://github.com/UshMask/flashforge-device-tab#install
  notes: Download flashforge_device_tab.py from a release and install it from OrcaSlicer's Plugins dialog.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or newer.
  platforms:
    - windows
  requires_custom_build: false
  notes: Windows x64 is the documented supported platform.
