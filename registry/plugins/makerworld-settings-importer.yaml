name: MakerWorld Settings Importer
summary: Converts a downloaded MakerWorld 3MF to the active printer while retaining compatible creator process settings.
description: >-
  Converts a local MakerWorld 3MF project for the currently active printer by
  applying compatible creator process settings to the existing setup. It avoids
  overwriting the target printer, build plate, or filament profiles. The plugin
  writes a converted project and a categorized report of changes and
  incompatibilities. Its documented workflow accepts downloaded files rather
  than MakerWorld URLs.
repository: https://github.com/FleeceFlames/Orca_makerworld_importer
categories:
  - profiles-and-calibration
status: available
status_note: README documents OrcaSlicer 2.5+ local installation and the 3MF conversion workflow.
installation:
  method: python
  url: https://github.com/FleeceFlames/Orca_makerworld_importer#installation
  notes: Download Orca_makerworld_importer.py from the GitHub release and install it through Plugins, or subscribe through Orca Cloud.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or newer.
  platforms:
    - windows
    - macos
    - linux
  requires_custom_build: false
  notes: The author documents native file pickers on all three platforms; Linux needs zenity or kdialog for that picker.
