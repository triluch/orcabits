name: Printloom
summary: Checks sliced jobs against a Printloom farm and sends them to its library and queue.
description: >-
  After slicing, the plugin asks Printloom to check clearance for the ejector arm, rack height, and available filament.
  It shows the results in OrcaSlicer and can send a job through the Printloom printer agent.
  The Printloom tab shows the farm's queue, rack, printer, and AMS status.
  The plugin needs a reachable Printloom installation; it does not replace the farm software.
repository: https://github.com/DasKlaus00/printloom
categories:
  - monitoring-and-print-farms
status: experimental
status_note: Upstream calls Printloom a work in progress and documents the plugin download from the farm's System page.
installation:
  method: python
  url: https://github.com/DasKlaus00/printloom#orcaslicer-plugin
  notes: Download the matching plugin from your Printloom System page, then install it through Plugins.
compatibility:
  orca_slicer: OrcaSlicer 2.5 or newer with Python plugins.
  platforms: []
  requires_custom_build: false
  notes: The upstream farm setup targets the Bambu Lab X1 Carbon and OTTOeject.
