name: Paramability
summary: Adds Paramability model editing and export tools to an OrcaSlicer tab.
description: >-
  Paramability makes STL, 3MF, OBJ, and STEP models adjustable through parameter forms.
  Its tools can split models with connectors, tune fits, add decals, and pose figurines.
  It can also convert meshes to STEP, with organic shapes remaining mostly triangulated.
  Users export results to a local folder and import them into OrcaSlicer manually.
  The plugin requires OrcaSlicer 2.5 or newer.
repository: https://github.com/GoMorko/paramability-orca-plugin
categories:
