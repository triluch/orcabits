name: U1 Control
summary: Adds a Snapmaker U1 control tab and print setup workflow to OrcaSlicer.
description: >-
  The plugin adds a printer tab with camera, four toolheads, RFID tags,
  Spoolman data, file management, and firmware settings. Its print workflow
  matches project filaments to toolheads and adjusts U1 G-code before sending
  jobs over the local network. When multiACE is active in supported modes,
  the plugin leaves filament routing and G-code to multiACE. On supported
  firmware the print setup also warns if the mounted nozzle type differs
  from the sliced profile. A top-down preview shows the chosen toolhead colors
  on the sliced model.
  The Toolheads card can load or unload several selected heads with one confirmation.
repository: https://github.com/bloodf/u1control
categories:
  - printer-connectivity
status: available
status_note: The README documents downloadable releases and Orca Cloud installation; automated tests use a fake printer.
installation:
