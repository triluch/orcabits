name: AnySharik Cloud
summary: Sends sliced jobs to Anycubic Cloud printers and monitors them in an OrcaSlicer tab.
description: >-
  Sign in through the Anycubic Cloud browser window and select a printer registered to that account.
  Set AnySharik as the printer agent to upload sliced G-code from OrcaSlicer's print action.
  The plugin tab can show telemetry and start, pause, resume, or stop jobs.
  This workflow uses Anycubic Cloud rather than connecting to a printer's LAN address.
repository: https://github.com/rkfsociety/AnySharik
categories:
  - printer-connectivity
status: experimental
status_note: The repository documents a source build and protocol tests but no printer test matrix.
installation:
  method: source
  url: https://github.com/rkfsociety/AnySharik/blob/HEAD/README.md
  notes: Build the wheel with the documented command, install it through Plugins, and activate the printer agent capability.
compatibility:
  orca_slicer: A build with Python plugins, Pages, and printer agents; upstream recommends a compatible nightly if needed.
  platforms:
    - windows
  requires_custom_build: false
  notes: The documented build and sign-in workflow uses Windows.
