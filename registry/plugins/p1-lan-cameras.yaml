    url: https://github.com/RJAudas/orcaslicer-lan-cameras/blob/13f893626b23aa617efd5862eb08a4ba0e332405/README.md
  - label: Plugin wheel and setup bundle
    url: https://github.com/RJAudas/orcaslicer-lan-cameras/releases/tag/v0.2.0
