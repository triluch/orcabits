name: Spoolio
summary: Manages Spoolman or Bambu Cloud spools, printer links, print progress, and filament usage from OrcaSlicer.
description: >-
  Spoolio displays spool inventory and can add or edit Spoolman records from
  its OrcaSlicer tab. Its printer view tracks loaded spools and job progress,
  while Slice Sync checks whether selected spools have enough filament. For
  Spoolman, it can book filament consumption after a print finishes and
  provides print and usage statistics. Live-link support for Klipper,
  PrusaLink, and OctoPrint is not hardware-tested according to the README.
repository: https://github.com/danm1989/spoolio-orcaslicer
categories:
  - filament-and-spool-management
status: experimental
status_note: Installable releases are documented, but Klipper, PrusaLink, and OctoPrint live links lack hardware testing.
installation:
  method: python
  url: https://github.com/danm1989/spoolio-orcaslicer/releases/latest
  notes: Download the platform-specific Python plugin from the latest release and install it in OrcaSlicer's plugin directory.
compatibility:
  orca_slicer: OrcaSlicer 2.5.0 or later.
  platforms:
    - windows
    - macos
    - linux
  requires_custom_build: false
  notes: Release files are listed for Windows, macOS, and Linux on x86-64 and ARM64; Bambu Cloud requires LAN mode for printer links.
evidence:
  - label: README and installation
    url: https://github.com/danm1989/spoolio-orcaslicer/blob/main/README.md
updated_at: "2026-11-19"
reviewed_at: "2026-11-20"
