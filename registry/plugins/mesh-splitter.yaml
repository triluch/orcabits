name: Mesh Splitter
summary: Splits a single mesh into color-coded parts for multi-filament printing.
description: >-
  Mesh Splitter reads models from the current OrcaSlicer plate in its own tab.
  It can split a mesh automatically, by disconnected shells, or by points you pick on the model.
  Each part can be moved, resized, or replaced with another STL while keeping its filament assignment.
  The plugin saves a multipart 3MF to Downloads, which you import back into OrcaSlicer.
repository: https://github.com/d-carrigg/mesh-splitter
categories:
  - modeling-and-textures
status: available
status_note: The author publishes a ready-to-install OrcaSlicer plugin and documents the split and reimport workflow.
installation:
  method: wheel
  url: https://github.com/d-carrigg/mesh-splitter/releases/latest
  notes: Install mesh_splitter_any.whl through Plugins, activate it, and allow writes to Downloads.
compatibility:
  orca_slicer: Stock OrcaSlicer 2.5 with Python plugin support.
  platforms:
    - linux
  requires_custom_build: false
  notes: Upstream checks native installation and 3MF reimport on OrcaSlicer 2.5.1 Linux AppImage. The separate command-line downloads are not plugin packages.
