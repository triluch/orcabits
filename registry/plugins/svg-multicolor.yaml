name: SVG Multicolor
summary: Converts multicolor SVG artwork into filament-assigned printable parts or artwork on saved projects.
description: >-
  SVG Multicolor converts SVG colors into aligned printable parts with filament assignments and an optional base.
  It can also apply raised or inlaid artwork to a selected surface in a saved project.
  The converter handles common SVG shapes, transforms, strokes, fill rules, and physical units.
  Text must be converted to paths, while bitmap images, masks, and clipping paths are unsupported.
  Applying artwork updates or copies a saved project rather than changing an unsaved plate directly.
repository: https://github.com/opoeta/orca-svg-multicor
