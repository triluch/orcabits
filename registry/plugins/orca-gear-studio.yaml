name: Orca Gear Studio
summary: Designs matched spur, helical, and herringbone gears in OrcaSlicer.
description: >-
  The studio provides a full tab and a compact dock for building gear pairs with adjustable tooth geometry.
  Each gear can have its own shaft bore, hub, or hardware recess.
  A synchronized 3D view and 2D engagement view help inspect tooth interference and center spacing.
  You can send the full pair, a single gear, or a smaller clearance test kit to the OrcaSlicer plate.
repository: https://github.com/victorFernande/orca-gear-generator
categories:
  - modeling-and-textures
status: available
status_note: The author publishes single-file and wheel packages and documents the Windows and macOS workflows.
installation:
  method: python
  url: https://github.com/victorFernande/orca-gear-generator/releases/latest
  notes: Install the released orca_gear_generator.py or wheel, following the repository's platform-specific instructions.
compatibility:
  orca_slicer: OrcaSlicer 2.5.1 or newer.
  platforms:
    - windows
    - macos
  requires_custom_build: false
  notes: Direct plate handoff is documented on Windows and on Apple Silicon and Intel Macs.
